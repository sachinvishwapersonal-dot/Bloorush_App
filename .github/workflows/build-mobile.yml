name: Build BlooRush Mobile Apps (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm install

      - name: 🔄 Sync Web Assets to Android
        run: npm run cap:sync

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlooRush-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS Package
    runs-on: macos-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📱 Add iOS Platform & Sync
        run: |
          node scripts/build-mobile.js
          npx cap add ios || true
          npx cap sync ios

      - name: 🔨 Build iOS Project (Unsigned Archive)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO

      - name: 📤 Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlooRush-iOS-App
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
          retention-days: 30
