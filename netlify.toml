[build]
  publish = "."
  functions = "netlify/functions"

# Proxy Firebase Auth's handler to this origin so signInWithRedirect works on
# mobile (avoids cross-domain storage being blocked). Requires authDomain=bloorush.com.
[[redirects]]
  from = "/__/auth/*"
  to = "https://mvp-bloorush.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://mvp-bloorush.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# NOTE: SECRETS_SCAN_OMIT_PATHS is configured as a Netlify ENVIRONMENT VARIABLE
# (Site configuration -> Environment variables), value: index.html
# The only flagged value is the Firebase Web API key, a public client identifier
# that must live in index.html. Secrets scanning stays fully enabled.

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "razorpay"]

# Cache-control so the customer app updates immediately on redeploy.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
